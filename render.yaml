services:
  - type: web
    name: judgeai-backend
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT --workers 1 --limit-concurrency 20 --timeout-keep-alive 65 --backlog 128"
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      # ── PDF parsing limits (memory) ──────────────────
      - key: JUDGEAI_MAX_PARSE_PAGES
        value: "10"
      - key: JUDGEAI_MAX_OCR_PAGES
        value: "5"
      - key: JUDGEAI_OCR_DPI
        value: "72"
      - key: JUDGEAI_PDF_REQUEST_TIMEOUT_SEC
        value: "45"
      # ── LLM limits (payload + latency) ──────────────
      - key: JUDGEAI_LLM_MAX_CHARS
        value: "12000"
      - key: JUDGEAI_LLM_MAX_TOKENS
        value: "1024"
      - key: JUDGEAI_LLM_TIMEOUT_SEC
        value: "55"
      - key: JUDGEAI_LLM_RETRIES
        value: "1"
      # ── Batch processing (Render free = 3; raise on paid tier) ─
      - key: JUDGEAI_BATCH_CONCURRENCY
        value: "3"
      # ── Logging ──────────────────────────────────────
      - key: LOG_LEVEL
        value: "INFO"
